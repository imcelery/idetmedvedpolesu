<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="main.css">

<title>Заголовок</title>
</head>
<body>



<h1>Hello world!!!</h1>

<div id = "asa">

</div>

<script>
    async function doThings(){
	event.preventDefault();
		let key = document.search.key.value;
		if(key.toString() != ""){ 
		let url = "https://app.zenserp.com/api/v2/search?apikey=4d16b280-4ed2-11ee-a439-8955335a721e&q=" + key.toString() + "&tbm=isch";

		
		console.log(url);
		try {
		let response = await fetch(url);

		if (response.ok) { // если HTTP-статус в диапазоне 200-299
		  // получаем тело ответа (см. про этот метод ниже)
		  let json = await response.json();
		  console.log(json);
		  console.log(json.image_results[0].sourceUrl);
		  
		  let img = document.createElement('img');
		  img.src = json.image_results[0].sourceUrl;

		  document.getElementById('asa').appendChild(img);

		} else {
		  alert("Ошибка HTTP: " + response.status);
		}
		} catch (err) {

		console.log(err);
		}

		}
		}


	
	
</script>
<form name="search">
	<input type="text" name="key" />
    <input onclick="doThings()" type="submit" name="find" value="Найти" />
</form>

</body>
</html>
